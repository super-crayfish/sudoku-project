<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数独游戏</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .sudoku-board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 0;
            margin: 0 auto 30px;
            width: 450px;
            height: 450px;
            border: 3px solid #333;
            border-radius: 5px;
            overflow: hidden;
        }

        .cell {
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .cell:hover:not(.fixed) {
            background: #f0f8ff;
            transform: scale(1.05);
        }

        .cell.selected {
            background: #87ceeb;
            color: #000;
        }

        .cell.fixed {
            background: #f5f5f5;
            color: #333;
            cursor: default;
        }

        .cell.error {
            background: #ffcccb;
            color: #d9534f;
        }

        .cell.highlight {
            background: #fff3cd;
        }

        .cell:nth-child(3n) {
            border-right: 2px solid #333;
        }

        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid #333;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .number-pad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 300px;
            margin: 0 auto;
        }

        .number-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .number-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .number-btn.clear {
            background: #f44336;
        }

        .number-btn.clear:hover {
            background: #da190b;
        }

        .action-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #1976D2;
            transform: scale(1.05);
        }

        .action-btn.new {
            background: #FF9800;
        }

        .action-btn.new:hover {
            background: #F57C00;
        }

        .message {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .difficulty {
            text-align: center;
            margin-bottom: 20px;
        }

        .difficulty select {
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>数独游戏</h1>

        <div class="difficulty">
            <label for="difficulty">难度选择：</label>
            <select id="difficulty">
                <option value="easy">简单</option>
                <option value="medium" selected>中等</option>
                <option value="hard">困难</option>
            </select>
        </div>

        <div class="sudoku-board" id="sudoku-board"></div>

        <div class="controls">
            <button class="action-btn new" onclick="newGame()">新游戏</button>
            <button class="action-btn" onclick="checkSolution()">检查答案</button>
            <button class="action-btn" onclick="getHint()">提示</button>
        </div>

        <div class="number-pad">
            <button class="number-btn" onclick="selectNumber(1)">1</button>
            <button class="number-btn" onclick="selectNumber(2)">2</button>
            <button class="number-btn" onclick="selectNumber(3)">3</button>
            <button class="number-btn" onclick="selectNumber(4)">4</button>
            <button class="number-btn" onclick="selectNumber(5)">5</button>
            <button class="number-btn" onclick="selectNumber(6)">6</button>
            <button class="number-btn" onclick="selectNumber(7)">7</button>
            <button class="number-btn" onclick="selectNumber(8)">8</button>
            <button class="number-btn" onclick="selectNumber(9)">9</button>
            <button class="number-btn clear" onclick="selectNumber(0)">清除</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script>
        let board = [];
        let solution = [];
        let selectedCell = null;
        let fixedCells = [];

        function initBoard() {
            board = Array(9).fill(null).map(() => Array(9).fill(0));
            solution = Array(9).fill(null).map(() => Array(9).fill(0));
            fixedCells = [];
            generateSudoku();
            renderBoard();
        }

        function generateSudoku() {
            const difficulty = document.getElementById('difficulty').value;
            const cellsToRemove = {
                'easy': 30,
                'medium': 40,
                'hard': 50
            }[difficulty];

            generateCompleteSudoku();

            const solutionCopy = solution.map(row => [...row]);

            let removed = 0;
            const positions = [];
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    positions.push([i, j]);
                }
            }

            positions.sort(() => Math.random() - 0.5);

            for (const [row, col] of positions) {
                if (removed >= cellsToRemove) break;

                const temp = solution[row][col];
                solution[row][col] = 0;

                if (hasUniqueSolution(solution)) {
                    removed++;
                } else {
                    solution[row][col] = temp;
                }
            }

            board = solution.map(row => [...row]);
            solution = solutionCopy;

            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    if (board[i][j] !== 0) {
                        fixedCells.push(`${i}-${j}`);
                    }
                }
            }
        }

        function generateCompleteSudoku() {
            const base = [
                [5,3,4,6,7,8,9,1,2],
                [6,7,2,1,9,5,3,4,8],
                [1,9,8,3,4,2,5,6,7],
                [8,5,9,7,6,1,4,2,3],
                [4,2,6,8,5,3,7,9,1],
                [7,1,3,9,2,4,8,5,6],
                [9,6,1,5,3,7,2,8,4],
                [2,8,7,4,1,9,6,3,5],
                [3,4,5,2,8,6,1,7,9]
            ];

            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    solution[i][j] = base[i][j];
                }
            }

            for (let i = 0; i < 20; i++) {
                swapRows();
                swapCols();
                swapBlocks();
            }
        }

        function swapRows() {
            const block = Math.floor(Math.random() * 3);
            const row1 = block * 3 + Math.floor(Math.random() * 3);
            const row2 = block * 3 + Math.floor(Math.random() * 3);

            if (row1 !== row2) {
                [solution[row1], solution[row2]] = [solution[row2], solution[row1]];
            }
        }

        function swapCols() {
            const block = Math.floor(Math.random() * 3);
            const col1 = block * 3 + Math.floor(Math.random() * 3);
            const col2 = block * 3 + Math.floor(Math.random() * 3);

            if (col1 !== col2) {
                for (let i = 0; i < 9; i++) {
                    [solution[i][col1], solution[i][col2]] = [solution[i][col2], solution[i][col1]];
                }
            }
        }

        function swapBlocks() {
            const direction = Math.random() < 0.5;
            if (direction) {
                const block1 = Math.floor(Math.random() * 3);
                const block2 = Math.floor(Math.random() * 3);

                if (block1 !== block2) {
                    for (let i = 0; i < 3; i++) {
                        [solution[block1 * 3 + i], solution[block2 * 3 + i]] =
                        [solution[block2 * 3 + i], solution[block1 * 3 + i]];
                    }
                }
            }
        }

        function hasUniqueSolution(board) {
            const testBoard = board.map(row => [...row]);
            return solveSudoku(testBoard);
        }

        function solveSudoku(board) {
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    if (board[row][col] === 0) {
                        for (let num = 1; num <= 9; num++) {
                            if (isValidMove(board, row, col, num)) {
                                board[row][col] = num;

                                if (solveSudoku(board)) {
                                    return true;
                                }

                                board[row][col] = 0;
                            }
                        }
                        return false;
                    }
                }
            }
            return true;
        }

        function isValidMove(board, row, col, num) {
            for (let i = 0; i < 9; i++) {
                if (board[row][i] === num || board[i][col] === num) {
                    return false;
                }
            }

            const blockRow = Math.floor(row / 3) * 3;
            const blockCol = Math.floor(col / 3) * 3;

            for (let i = blockRow; i < blockRow + 3; i++) {
                for (let j = blockCol; j < blockCol + 3; j++) {
                    if (board[i][j] === num) {
                        return false;
                    }
                }
            }

            return true;
        }

        function renderBoard() {
            const boardElement = document.getElementById('sudoku-board');
            boardElement.innerHTML = '';

            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;

                    if (board[i][j] !== 0) {
                        cell.textContent = board[i][j];
                        if (fixedCells.includes(`${i}-${j}`)) {
                            cell.classList.add('fixed');
                        }
                    }

                    cell.addEventListener('click', selectCell);
                    boardElement.appendChild(cell);
                }
            }
        }

        function selectCell(event) {
            const cell = event.target;

            if (cell.classList.contains('fixed')) {
                return;
            }

            document.querySelectorAll('.cell').forEach(c => {
                c.classList.remove('selected', 'highlight');
            });

            cell.classList.add('selected');
            selectedCell = cell;

            const row = parseInt(cell.dataset.row);
            const col = parseInt(cell.dataset.col);

            document.querySelectorAll('.cell').forEach(c => {
                const r = parseInt(c.dataset.row);
                const c = parseInt(c.dataset.col);

                if (r === row || c === col ||
                    (Math.floor(r / 3) === Math.floor(row / 3) &&
                     Math.floor(c / 3) === Math.floor(col / 3))) {
                    c.classList.add('highlight');
                }
            });
        }

        function selectNumber(num) {
            if (!selectedCell) {
                showMessage('请先选择一个单元格', 'error');
                return;
            }

            const row = parseInt(selectedCell.dataset.row);
            const col = parseInt(selectedCell.dataset.col);

            if (fixedCells.includes(`${row}-${col}`)) {
                showMessage('不能修改固定的数字', 'error');
                return;
            }

            if (num === 0) {
                board[row][col] = 0;
                selectedCell.textContent = '';
                selectedCell.classList.remove('error');
            } else {
                board[row][col] = num;
                selectedCell.textContent = num;

                if (isValidMove(board, row, col, num)) {
                    selectedCell.classList.remove('error');
                } else {
                    selectedCell.classList.add('error');
                }
            }

            if (isComplete()) {
                showMessage('恭喜你完成了数独！', 'success');
            }
        }

        function isComplete() {
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    if (board[i][j] === 0) {
                        return false;
                    }
                }
            }

            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    const num = board[i][j];
                    board[i][j] = 0;
                    if (!isValidMove(board, i, j, num)) {
                        board[i][j] = num;
                        return false;
                    }
                    board[i][j] = num;
                }
            }

            return true;
        }

        function checkSolution() {
            let hasErrors = false;
            let isEmpty = false;

            document.querySelectorAll('.cell').forEach(cell => {
                const row = parseInt(cell.dataset.row);
                const col = parseInt(cell.dataset.col);
                const num = board[row][col];

                if (num === 0) {
                    isEmpty = true;
                    return;
                }

                board[row][col] = 0;
                if (!isValidMove(board, row, col, num)) {
                    cell.classList.add('error');
                    hasErrors = true;
                } else {
                    cell.classList.remove('error');
                }
                board[row][col] = num;
            });

            if (isEmpty) {
                showMessage('还有空格需要填写', 'error');
            } else if (hasErrors) {
                showMessage('存在错误的数字，请检查标红的格子', 'error');
            } else {
                showMessage('目前所有数字都正确！继续加油！', 'success');
            }
        }

        function getHint() {
            const emptyCells = [];
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    if (board[i][j] === 0) {
                        emptyCells.push([i, j]);
                    }
                }
            }

            if (emptyCells.length === 0) {
                showMessage('没有空格需要提示', 'error');
                return;
            }

            const [row, col] = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            const correctNum = solution[row][col];

            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            cell.textContent = correctNum;
            cell.classList.add('selected');
            setTimeout(() => cell.classList.remove('selected'), 2000);

            showMessage(`提示：第${row + 1}行第${col + 1}列应该填 ${correctNum}`, 'success');
        }

        function newGame() {
            initBoard();
            selectedCell = null;
            showMessage('新游戏已开始！', 'success');
        }

        function showMessage(text, type) {
            const messageElement = document.getElementById('message');
            messageElement.textContent = text;
            messageElement.className = `message ${type}`;
            messageElement.style.display = 'block';

            setTimeout(() => {
                messageElement.style.display = 'none';
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', initBoard);
    </script>
</body>
</html>
