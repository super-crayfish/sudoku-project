<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 直连聊天（免 Termux）</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:;">
<style>
:root {
  --app-bg:#f7f7fa; --surface:#fff; --border:#e8e8ee;
  --text:#333; --text-dim:#999; --text-faint:#bbb;
  --bot-bg:#fff; --input-bg:#f7f7fa; --input-border:#ddd;
  --accent:#1a5fb4; --accent2:#124a8f;
  --code-bg:rgba(0,0,0,.07); --err-bg:#fdecea; --err-fg:#c0392b; --err-border:#f5c6cb;
  --page-grad:linear-gradient(135deg,#0b2d5c 0%,#14508f 100%);
}
body.dark {
  --app-bg:#15181e; --surface:#1e2229; --border:#2a2f38;
  --text:#e8e8ea; --text-dim:#8b9099; --text-faint:#5c626b;
  --bot-bg:#252a33; --input-bg:#15181e; --input-border:#3a404b;
  --accent:#7fb3d5; --accent2:#3d6478;
  --code-bg:rgba(255,255,255,.09); --err-bg:#3a2225; --err-fg:#ff8a80; --err-border:#5c3034;
  --page-grad:linear-gradient(135deg,#05070a 0%,#0d1117 100%);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--page-grad); display:flex; justify-content:center; }
#app { width:100%; max-width:720px; height:100dvh; display:flex; flex-direction:column; background:var(--app-bg); box-shadow:0 0 40px rgba(0,0,0,.4); }
header { display:flex; align-items:center; gap:8px; padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
header h1 { font-size:16px; color:var(--text); flex:1; }
#modelBadge { font-size:11px; color:#0e7490; background:#e0f2fe; padding:3px 8px; border-radius:10px; }
body.dark #modelBadge { color:#7fd4f5; background:#173242; }
.iconbtn { border:none; background:none; font-size:20px; cursor:pointer; padding:6px; border-radius:8px; color:var(--text-dim); }
#messages { flex:1; overflow-y:auto; padding:16px 14px; -webkit-overflow-scrolling:touch; }
.msg { display:flex; margin-bottom:14px; }
.msg.user { justify-content:flex-end; }
.bubble { max-width:85%; padding:10px 14px; border-radius:16px; font-size:15px; line-height:1.6; word-break:break-word; white-space:pre-wrap; }
.msg.user .bubble { background:linear-gradient(135deg,#0b2d5c,#1a5fb4); color:#fff; border-bottom-right-radius:4px; }
.msg.bot  .bubble { background:var(--bot-bg,#fff); color:var(--text,#333); border-bottom-left-radius:4px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.msg.err  .bubble { background:var(--err-bg); color:var(--err-fg); border:1px solid var(--err-border); white-space:normal; }
.bubble code { background:var(--code-bg); padding:1px 5px; border-radius:4px; font-family:monospace; font-size:13px; }
.msg.user .bubble code { background:rgba(255,255,255,.2); }
.bubble pre { background:#282c34; color:#abb2bf; padding:10px 12px; border-radius:8px; overflow-x:auto; margin:8px 0; font-size:13px; white-space:pre; }
.bubble pre code { background:none; padding:0; }
.cursor { display:inline-block; width:8px; height:16px; background:var(--accent); vertical-align:-2px; animation:blink .8s infinite; border-radius:2px; }
@keyframes blink { 50% { opacity:0; } }
#empty { text-align:center; color:var(--text-faint); margin-top:38vh; font-size:14px; padding:0 30px; }
#composer { display:flex; align-items:flex-end; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--border); flex-shrink:0; }
#input { flex:1; border:1px solid var(--input-border); border-radius:20px; padding:10px 16px; font-size:15px; font-family:inherit; resize:none; max-height:120px; outline:none; line-height:1.4; background:var(--input-bg); color:var(--text); }
#send { border:none; background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff; width:42px; height:42px; border-radius:50%; font-size:17px; cursor:pointer; flex-shrink:0; }
#send.stop { background:#e74c3c; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>AI 直连</h1>
    <span id="modelBadge">…</span>
    <button class="iconbtn" id="themeBtn">🌙</button>
    <button class="iconbtn" id="newBtn" title="新对话">✚</button>
    <button class="iconbtn" id="setBtn" title="设置">⚙</button>
  </header>
  <div id="messages"><div id="empty"><div style="font-size:44px;margin-bottom:12px">☁️</div>浏览器直连云端模型<br><span style="font-size:12px">不依赖 Termux，永远不会被冻结</span></div></div>
  <div id="composer">
    <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
    <button id="send">➤</button>
  </div>
</div>
<div id="overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:99;">
  <div style="background:var(--surface);border-radius:16px;padding:22px;width:100%;max-width:400px;">
    <h2 style="font-size:18px;color:var(--text);margin-bottom:14px;">⚙ 设置</h2>
    <label style="display:block;font-size:13px;color:var(--text-dim);margin:10px 0 4px;">API 地址（OpenAI 兼容）</label>
    <input id="cfgBase" style="width:100%;padding:9px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:13px;">
    <label style="display:block;font-size:13px;color:var(--text-dim);margin:10px 0 4px;">API Key</label>
    <input id="cfgKey" type="password" style="width:100%;padding:9px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:13px;">
    <label style="display:block;font-size:13px;color:var(--text-dim);margin:10px 0 4px;">模型</label>
    <input id="cfgModel" style="width:100%;padding:9px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:13px;">
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button id="cfgSave" style="flex:1;padding:11px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:bold;">保存</button>
      <button id="cfgClose" style="padding:11px 18px;border:none;border-radius:10px;background:var(--code-bg);color:var(--text);">取消</button>
    </div>
  </div>
</div>
<script>
"use strict";
var $ = function(id){ return document.getElementById(id); };
var busy = false;
var LS = {
  get: function(k, d){ try { var v = localStorage.getItem("cd_"+k); return v===null?d:JSON.parse(v); } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem("cd_"+k, JSON.stringify(v)); } catch(e){} }
};
var cfg = {
  base: LS.get("base", "https://api.vectorengine.ai/v1"),
  key:  LS.get("key", ""),
  model: LS.get("model", "gpt-5.5")
};
var history = LS.get("history", []);

/* 主题 */
var theme = LS.get("theme", "light");
function applyTheme(){ document.body.classList.toggle("dark", theme==="dark"); $("themeBtn").textContent = theme==="dark" ? "☀️" : "🌙"; }
applyTheme();
$("themeBtn").onclick = function(){ theme = theme==="dark"?"light":"dark"; LS.set("theme", theme); applyTheme(); };

/* 设置 */
$("setBtn").onclick = function(){
  $("cfgBase").value = cfg.base; $("cfgKey").value = cfg.key; $("cfgModel").value = cfg.model;
  $("overlay").style.display = "flex";
};
$("cfgClose").onclick = function(){ $("overlay").style.display = "none"; };
$("cfgSave").onclick = function(){
  cfg.base = $("cfgBase").value.trim() || cfg.base;
  cfg.key = $("cfgKey").value.trim();
  cfg.model = $("cfgModel").value.trim() || cfg.model;
  LS.set("base", cfg.base); LS.set("key", cfg.key); LS.set("model", cfg.model);
  $("modelBadge").textContent = cfg.model;
  $("overlay").style.display = "none";
};
$("modelBadge").textContent = cfg.model;

/* 新对话 */
$("newBtn").onclick = function(){
  if (busy) return;
  history = []; LS.set("history", history);
  $("messages").innerHTML = '<div id="empty"><div style="font-size:44px;margin-bottom:12px">☁️</div>新对话已开始</div>';
};

/* 渲染 */
function mdRender(t){
  var e = t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  var blocks = [];
  var out = e.replace(/```(\w*)\n?([\s\S]*?)```/g, function(m,l,c){
    blocks.push('<pre><code>'+c.replace(/\n$/,"")+'</code></pre>');
    return "\u0000B"+(blocks.length-1)+"\u0000";
  });
  var fences = out.split("```").length - 1;
  if (fences % 2 === 1) {
    var idx = out.lastIndexOf("```");
    blocks.push('<pre><code>'+out.slice(idx+3).replace(/\n$/,"")+'</code></pre>');
    out = out.slice(0, idx) + "\u0000B"+(blocks.length-1)+"\u0000";
  }
  out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  out = out.replace(/\u0000B(\d+)\u0000/g, function(m,i){ return blocks[Number(i)]; });
  return out;
}
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function addMsg(role, html){
  var e = $("empty"); if (e) e.remove();
  var d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = '<div class="bubble">' + html + "</div>";
  $("messages").appendChild(d);
  $("messages").scrollTop = $("messages").scrollHeight;
  return d.querySelector(".bubble");
}

/* 输入 */
var input = $("input");
input.addEventListener("input", function(){ this.style.height="auto"; this.style.height=Math.min(this.scrollHeight,120)+"px"; });
$("send").onclick = function(){ busy ? stopGen() : send(); };
input.addEventListener("keydown", function(e){
  if (e.key==="Enter" && !e.shiftKey && matchMedia("(hover:hover)").matches){ e.preventDefault(); send(); }
});

/* 发送（OpenAI SSE 流式） */
var ctrl = null;
function send(){
  var text = input.value.trim();
  if (!text || busy) return;
  if (!cfg.key) { addMsg("err", "⚠ 请先点 ⚙ 设置 API Key"); return; }
  input.value = ""; input.style.height = "auto";
  addMsg("user", mdRender(text));
  history.push({ role:"user", content:text });
  busy = true;
  var btn = $("send"); btn.textContent = "■"; btn.classList.add("stop");
  var bubble = addMsg("bot", '<span class="cursor"></span>');
  var acc = "", buf = "";
  function finish(){
    bubble.innerHTML = acc ? mdRender(acc) : "（空回复）";
    if (acc) history.push({ role:"assistant", content:acc });
    LS.set("history", history);
    busy = false; ctrl = null;
    btn.textContent = "➤"; btn.classList.remove("stop");
    $("messages").scrollTop = $("messages").scrollHeight;
  }
  ctrl = new AbortController();
  fetch(cfg.base.replace(/\/$/,"") + "/chat/completions", {
    method: "POST",
    signal: ctrl.signal,
    headers: { "content-type":"application/json", "authorization":"Bearer " + cfg.key },
    body: JSON.stringify({ model: cfg.model, max_tokens: 8192, messages: history, stream: true })
  }).then(function(res){
    if (!res.ok) return res.text().then(function(t){
      var msg = "HTTP " + res.status;
      try { msg = JSON.parse(t).error.message || msg; } catch(e){}
      throw new Error(msg);
    });
    var reader = res.body.getReader(), dec = new TextDecoder();
    function pump(){
      return reader.read().then(function(r){
        if (r.done) return finish();
        buf += dec.decode(r.value, { stream:true });
        var lines = buf.split("\n"); buf = lines.pop();
        for (var i=0;i<lines.length;i++){
          var line = lines[i].trim();
          if (line.indexOf("data:") !== 0) continue;
          var payload = line.slice(5).trim();
          if (!payload || payload === "[DONE]") continue;
          try {
            var ev = JSON.parse(payload);
            var delta = ev.choices && ev.choices[0] && (ev.choices[0].delta || {}).content;
            if (delta) { acc += delta; bubble.innerHTML = mdRender(acc) + '<span class="cursor"></span>'; $("messages").scrollTop = $("messages").scrollHeight; }
          } catch(e){}
        }
        return pump();
      });
    }
    return pump();
  }).catch(function(e){
    if (e.name === "AbortError") { finish(); return; }
    bubble.innerHTML = "⚠ " + esc(e.message || "请求失败") +
      '<br><span style="font-size:11px;color:#999">点 ⚙ 检查地址和 key；此页面不依赖 Termux</span>';
    if (history.length && history[history.length-1].role === "user") history.pop();
    LS.set("history", history);
    busy = false; ctrl = null;
    var btn = $("send"); btn.textContent = "➤"; btn.classList.remove("stop");
  });
}
function stopGen(){ if (ctrl) ctrl.abort(); }

/* 恢复历史 */
if (history.length){
  $("messages").innerHTML = "";
  for (var i=0;i<history.length;i++){
    addMsg(history[i].role === "user" ? "user" : "bot", mdRender(history[i].content));
  }
  $("messages").scrollTop = $("messages").scrollHeight;
}
</script>
</body>
</html>
