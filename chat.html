<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Claude 聊天</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body {
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  display:flex; justify-content:center;
}
#app {
  width:100%; max-width:720px; height:100dvh;
  display:flex; flex-direction:column; background:#f7f7fa;
  box-shadow:0 0 40px rgba(0,0,0,.25);
}

/* ---------- 顶部栏 ---------- */
header {
  display:flex; align-items:center; gap:10px;
  padding:12px 16px; background:#fff;
  border-bottom:1px solid #e8e8ee; flex-shrink:0;
}
header h1 { font-size:17px; color:#333; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#modelBadge {
  font-size:11px; color:#764ba2; background:#f1eafa;
  padding:3px 8px; border-radius:10px; max-width:40%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.iconbtn {
  border:none; background:none; font-size:20px; cursor:pointer;
  padding:6px; border-radius:8px; color:#555; line-height:1;
}
.iconbtn:active { background:#eee; }

/* ---------- 消息区 ---------- */
#messages { flex:1; overflow-y:auto; padding:16px 14px; -webkit-overflow-scrolling:touch; }
.msg { display:flex; margin-bottom:14px; }
.msg.user { justify-content:flex-end; }
.bubble {
  max-width:82%; padding:10px 14px; border-radius:16px;
  font-size:15px; line-height:1.6; word-break:break-word;
  white-space:pre-wrap;
}
.msg.user .bubble { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border-bottom-right-radius:4px; }
.msg.bot  .bubble { background:#fff; color:#333; border-bottom-left-radius:4px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.msg.err  .bubble { background:#fdecea; color:#c0392b; border:1px solid #f5c6cb; }
.bubble code { background:rgba(0,0,0,.07); padding:1px 5px; border-radius:4px; font-family:monospace; font-size:13px; }
.msg.user .bubble code { background:rgba(255,255,255,.2); }
.bubble pre {
  background:#282c34; color:#abb2bf; padding:10px 12px; border-radius:8px;
  overflow-x:auto; margin:8px 0; font-size:13px; line-height:1.5;
}
.bubble pre code { background:none; padding:0; color:inherit; }
.cursor { display:inline-block; width:8px; height:16px; background:#764ba2; vertical-align:-2px; animation:blink .8s infinite; border-radius:2px; }
@keyframes blink { 50% { opacity:0; } }
#empty {
  text-align:center; color:#aaa; margin-top:38vh; font-size:14px; padding:0 30px;
}
#empty .big { font-size:44px; margin-bottom:12px; }

/* ---------- 输入区 ---------- */
#composer {
  display:flex; align-items:flex-end; gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:#fff; border-top:1px solid #e8e8ee; flex-shrink:0;
}
#input {
  flex:1; border:1px solid #ddd; border-radius:20px;
  padding:10px 16px; font-size:15px; font-family:inherit;
  resize:none; max-height:120px; outline:none; line-height:1.4; background:#f7f7fa;
}
#input:focus { border-color:#764ba2; background:#fff; }
#send {
  border:none; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff;
  width:42px; height:42px; border-radius:50%; font-size:17px; cursor:pointer; flex-shrink:0;
}
#send:disabled { opacity:.4; }
#send.stop { background:#e74c3c; }

/* ---------- 设置弹层 ---------- */
#overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.45);
  display:none; align-items:center; justify-content:center; padding:20px; z-index:99;
}
#overlay.show { display:flex; }
.panel {
  background:#fff; border-radius:16px; padding:24px; width:100%; max-width:420px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
}
.panel h2 { font-size:19px; color:#333; margin-bottom:4px; }
.panel .sub { font-size:12px; color:#999; margin-bottom:18px; line-height:1.5; }
.panel label { display:block; font-size:13px; color:#555; margin:14px 0 6px; font-weight:bold; }
.panel input[type=password], .panel input[type=text], .panel select, .panel textarea {
  width:100%; border:1px solid #ddd; border-radius:8px; padding:10px 12px;
  font-size:14px; font-family:inherit; outline:none; background:#fafafa;
}
.panel input:focus, .panel select:focus, .panel textarea:focus { border-color:#764ba2; background:#fff; }
.panel textarea { resize:vertical; min-height:60px; }
.keyrow { display:flex; gap:8px; }
.keyrow input { flex:1; }
.keyrow button {
  border:none; background:#eee; border-radius:8px; padding:0 14px; cursor:pointer; font-size:13px;
}
.panel .actions { display:flex; gap:10px; margin-top:22px; }
.panel .actions button {
  flex:1; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:bold; cursor:pointer;
}
#saveBtn { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; }
#wipeBtn { background:#f0f0f0; color:#888; }
.note { font-size:11px; color:#bbb; margin-top:14px; line-height:1.6; }
.note a { color:#764ba2; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Claude 聊天</h1>
    <span id="modelBadge"></span>
    <button class="iconbtn" id="newBtn" title="新对话">✚</button>
    <button class="iconbtn" id="setBtn" title="设置">⚙</button>
  </header>

  <div id="messages">
    <div id="empty">
      <div class="big">💬</div>
      已就绪，开始和 Claude 对话吧<br>
      <span style="font-size:12px">回复为流式输出，点发送键可随时停止</span>
    </div>
  </div>

  <div id="composer">
    <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
    <button id="send">➤</button>
  </div>
</div>

<!-- 设置弹层 -->
<div id="overlay">
  <div class="panel">
    <h2>⚙ 设置</h2>
    <div class="sub">配置保存在本机浏览器 (localStorage)，只发送给 Anthropic 官方接口。</div>

    <label>Anthropic API Key</label>
    <div class="keyrow">
      <input type="password" id="keyInput" placeholder="sk-ant-...">
      <button id="eyeBtn">显示</button>
    </div>

    <label>模型</label>
    <select id="modelSel">
      <option value="claude-sonnet-4-5-20250929">Claude Sonnet 4.5（推荐·均衡）</option>
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5（快速·便宜）</option>
      <option value="claude-opus-4-1-20250805">Claude Opus 4.1（最强）</option>
      <option value="__custom">自定义…</option>
    </select>
    <input type="text" id="modelCustom" placeholder="输入模型 ID，如 claude-xxx" style="display:none;margin-top:8px">

    <label>系统提示词（可选）</label>
    <textarea id="sysInput" placeholder="例如：你是一个耐心的编程助手，用中文回答"></textarea>

    <div class="actions">
      <button id="wipeBtn">清除对话</button>
      <button id="saveBtn">保存</button>
    </div>

    <div class="note">
      API key 在 <a href="https://platform.claude.com" target="_blank">platform.claude.com</a> 申请（需科学上网）。<br>
      key 仅存本机，请求直达 api.anthropic.com，无第三方中转。
    </div>
  </div>
</div>

<script>
"use strict";
var $ = function(id){ return document.getElementById(id); };
var store = {
  get: function(){ try { return JSON.parse(localStorage.getItem("cc_cfg")||"{}"); } catch(e){ return {}; } },
  set: function(c){ localStorage.setItem("cc_cfg", JSON.stringify(c)); }
};
var cfg = store.get();
var history = [];          // [{role:"user"|"assistant", content:"..."}]
var busy = false;
var ctrl = null;

/* ============ 初始化 ============ */
(function init(){
  if (cfg.model && cfg.model !== "__custom") $("modelSel").value = cfg.model;
  if (cfg.modelCustom) { $("modelSel").value = "__custom"; $("modelCustom").value = cfg.modelCustom; }
  if (cfg.sys) $("sysInput").value = cfg.sys;
  $("keyInput").value = cfg.key || "";
  updateBadge();
  if (!cfg.key || !currentModel()) openSettings();
})();

function currentModel(){
  return $("modelSel").value === "__custom" ? $("modelCustom").value.trim() : $("modelSel").value;
}
function updateBadge(){ $("modelBadge").textContent = currentModel() || "未配置"; }

/* ============ 设置 ============ */
function openSettings(){ $("overlay").classList.add("show"); }
$("setBtn").onclick = openSettings;
$("overlay").addEventListener("click", function(e){ if(e.target === $("overlay") && cfg.key) $("overlay").classList.remove("show"); });
$("modelSel").onchange = function(){ $("modelCustom").style.display = this.value==="__custom" ? "block" : "none"; };
$("eyeBtn").onclick = function(){
  var k = $("keyInput");
  k.type = k.type === "password" ? "text" : "password";
  this.textContent = k.type === "password" ? "显示" : "隐藏";
};
$("saveBtn").onclick = function(){
  cfg.key = $("keyInput").value.trim();
  cfg.model = $("modelSel").value;
  cfg.modelCustom = $("modelCustom").value.trim();
  cfg.sys = $("sysInput").value.trim();
  if (!cfg.key) { alert("请填写 API Key"); return; }
  if (!currentModel()) { alert("请选择或填写模型"); return; }
  store.set(cfg);
  updateBadge();
  $("overlay").classList.remove("show");
};
$("wipeBtn").onclick = function(){
  if (!confirm("清空当前对话记录？")) return;
  history = [];
  $("messages").innerHTML = '<div id="empty"><div class="big">💬</div>已就绪，开始和 Claude 对话吧</div>';
  $("overlay").classList.remove("show");
};
$("newBtn").onclick = function(){
  if (busy || !history.length) return;
  if (!confirm("开始新对话？（当前记录会被清除）")) return;
  history = [];
  var m = $("messages");
  m.innerHTML = '<div id="empty"><div class="big">💬</div>新对话已开始</div>';
};

/* ============ 输入框 ============ */
var input = $("input");
input.addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});
$("send").onclick = function(){ busy ? stopGen() : send(); };

function mdRender(t){
  var esc = t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return esc
    .replace(/```(\w*)\n?([\s\S]*?)```/g, function(m,l,c){ return '<pre><code>'+c.replace(/\n$/,"")+'</code></pre>'; })
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
}
function addMsg(role, html){
  var empty = $("empty"); if (empty) empty.remove();
  var d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = '<div class="bubble">' + html + "</div>";
  $("messages").appendChild(d);
  $("messages").scrollTop = $("messages").scrollHeight;
  return d.querySelector(".bubble");
}
function scrollBottom(){ $("messages").scrollTop = $("messages").scrollHeight; }

/* ============ 发送 & 流式 ============ */
function send(){
  var text = input.value.trim();
  if (!text || busy) return;
  if (!cfg.key || !currentModel()) { openSettings(); return; }
  input.value = ""; input.style.height = "auto";
  addMsg("user", mdRender(text));
  history.push({ role:"user", content:text });
  ask();
}

function ask(){
  busy = true;
  var btn = $("send");
  btn.textContent = "■"; btn.classList.add("stop");
  var bubble = addMsg("bot", '<span class="cursor"></span>');
  var acc = "";
  ctrl = new AbortController();

  var body = { model: currentModel(), max_tokens: 4096, stream: true, messages: history };
  if (cfg.sys) body.system = cfg.sys;

  fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    signal: ctrl.signal,
    headers: {
      "content-type": "application/json",
      "x-api-key": cfg.key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(body)
  }).then(function(res){
    if (!res.ok) {
      return res.text().then(function(t){
        var msg = "HTTP " + res.status;
        try { msg = JSON.parse(t).error.message; } catch(e){}
        if (res.status === 401) msg = "API Key 无效 (401)，请到 ⚙ 设置检查";
        if (res.status === 429) msg = "请求太频繁 (429)，稍后再试";
        throw new Error(msg);
      });
    }
    var reader = res.body.getReader();
    var dec = new TextDecoder();
    var buf = "";
    function pump(){
      return reader.read().then(function(r){
        if (r.done) return finish();
        buf += dec.decode(r.value, { stream:true });
        var lines = buf.split("\n");
        buf = lines.pop();
        for (var i=0;i<lines.length;i++){
          var line = lines[i].trim();
          if (line.indexOf("data:") !== 0) continue;
          var payload = line.slice(5).trim();
          if (!payload || payload === "[DONE]") continue;
          try {
            var ev = JSON.parse(payload);
            if (ev.type === "content_block_delta" && ev.delta && ev.delta.text){
              acc += ev.delta.text;
              bubble.innerHTML = mdRender(acc) + '<span class="cursor"></span>';
              scrollBottom();
            }
            if (ev.type === "error") throw new Error(ev.error && ev.error.message || "流式错误");
          } catch(e){ if (e.message && e.message.indexOf("流式")===0) throw e; }
        }
        return pump();
      });
    }
    return pump();
  }).catch(function(e){
    if (e.name === "AbortError") { finish(); return; }
    bubble.innerHTML = "⚠ " + (e.message || "网络错误，请检查网络/是否需要代理") +
      '<br><span style="font-size:11px;color:#999">注：直连 api.anthropic.com，部分地区需开启代理</span>';
    history.pop();  // 回滚这条 user 消息，方便重试
    endBusy();
    return;
  });
  finish = function(){
    if (acc) {
      bubble.innerHTML = mdRender(acc);
      history.push({ role:"assistant", content:acc });
    } else if (!bubble.dataset.err) {
      bubble.innerHTML = "（空回复）";
    }
    endBusy();
  };
}
var finish = function(){};
function stopGen(){ if (ctrl) ctrl.abort(); }
function endBusy(){
  busy = false; ctrl = null;
  var btn = $("send");
  btn.textContent = "➤"; btn.classList.remove("stop");
  scrollBottom();
}

/* 回车发送（桌面），手机用发送键 */
input.addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey && matchMedia("(hover:hover)").matches) {
    e.preventDefault(); send();
  }
});
</script>
</body>
</html>
