<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pi 聊天</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:;">
<style>
:root {
  --app-bg:#f7f7fa; --surface:#fff; --border:#e8e8ee;
  --text:#333; --text-dim:#999; --text-faint:#bbb;
  --bot-bg:#fff; --bot-shadow:0 1px 3px rgba(0,0,0,.06);
  --input-bg:#f7f7fa; --input-border:#ddd;
  --accent:#2c5364; --accent2:#203a43;
  --badge-fg:#0e7490; --badge-bg:#e0f2fe;
  --think-fg:#999; --think-border:#ddd;
  --code-bg:rgba(0,0,0,.07);
  --err-bg:#fdecea; --err-fg:#c0392b; --err-border:#f5c6cb;
  --item-border:#f2f2f4; --item-active:#eef4f8; --icon-active:#eee;
  --user-grad:linear-gradient(135deg,#0f2027,#2c5364);
  --page-grad:linear-gradient(135deg,#0f2027 0%,#203a43 50%,#2c5364 100%);
}
body.dark {
  --app-bg:#15181e; --surface:#1e2229; --border:#2a2f38;
  --text:#e8e8ea; --text-dim:#8b9099; --text-faint:#5c626b;
  --bot-bg:#252a33; --bot-shadow:0 1px 3px rgba(0,0,0,.35);
  --input-bg:#15181e; --input-border:#3a404b;
  --accent:#7fb3d5; --accent2:#3d6478;
  --badge-fg:#7fd4f5; --badge-bg:#173242;
  --think-fg:#8b9099; --think-border:#3a404b;
  --code-bg:rgba(255,255,255,.09);
  --err-bg:#3a2225; --err-fg:#ff8a80; --err-border:#5c3034;
  --item-border:#2a2f38; --item-active:#232b36; --icon-active:#2a2f38;
  --user-grad:linear-gradient(135deg,#2c5364,#4a7a96);
  --page-grad:linear-gradient(135deg,#05070a 0%,#0d1117 50%,#141a22 100%);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body {
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--page-grad);
  display:flex; justify-content:center;
}
#app {
  width:100%; max-width:720px; height:100dvh;
  display:flex; flex-direction:column; background:var(--app-bg);
  box-shadow:0 0 40px rgba(0,0,0,.4);
}
header {
  display:flex; align-items:center; gap:10px;
  padding:12px 16px; background:var(--surface);
  border-bottom:1px solid var(--border); flex-shrink:0;
}
header h1 { font-size:17px; color:var(--text); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#modelBadge {
  font-size:11px; color:var(--badge-fg); background:var(--badge-bg);
  padding:3px 8px; border-radius:10px; max-width:36%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.iconbtn {
  border:none; background:none; font-size:20px; cursor:pointer;
  padding:6px; border-radius:8px; color:var(--text-dim); line-height:1; flex-shrink:0;
}
.iconbtn:active { background:var(--icon-active); }
#messages { flex:1; overflow-y:auto; padding:16px 14px; -webkit-overflow-scrolling:touch; }
.msg { display:flex; margin-bottom:14px; }
.msg.user { justify-content:flex-end; }
.bubble {
  max-width:82%; padding:10px 14px; border-radius:16px;
  font-size:15px; line-height:1.6; word-break:break-word; white-space:pre-wrap;
}
.msg.user .bubble { background:var(--user-grad); color:#fff; border-bottom-right-radius:4px; }
.msg.bot  .bubble { background:var(--bot-bg); color:var(--text); border-bottom-left-radius:4px; box-shadow:var(--bot-shadow); }
.msg.err  .bubble { background:var(--err-bg); color:var(--err-fg); border:1px solid var(--err-border); white-space:normal; }
.bubble code { background:var(--code-bg); padding:1px 5px; border-radius:4px; font-family:monospace; font-size:13px; }
.msg.user .bubble code { background:rgba(255,255,255,.2); }
.bubble pre {
  background:#282c34; color:#abb2bf; padding:10px 12px; border-radius:8px;
  overflow-x:auto; margin:8px 0; font-size:13px; line-height:1.5; white-space:pre;
}
.bubble pre code { background:none; padding:0; color:inherit; }
.think {
  color:var(--think-fg); font-size:12px; font-style:italic;
  border-left:3px solid var(--think-border); padding:2px 0 2px 8px; margin-bottom:6px;
}
.think.live { max-height:64px; overflow:hidden; }
.cursor { display:inline-block; width:8px; height:16px; background:var(--accent); vertical-align:-2px; animation:blink .8s infinite; border-radius:2px; }
@keyframes blink { 50% { opacity:0; } }
#empty { text-align:center; color:var(--text-faint); margin-top:38vh; font-size:14px; padding:0 30px; }
#empty .big { font-size:44px; margin-bottom:12px; }
#composer {
  display:flex; align-items:flex-end; gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--surface); border-top:1px solid var(--border); flex-shrink:0;
}
#input {
  flex:1; border:1px solid var(--input-border); border-radius:20px;
  padding:10px 16px; font-size:15px; font-family:inherit;
  resize:none; max-height:120px; outline:none; line-height:1.4;
  background:var(--input-bg); color:var(--text);
}
#input:focus { border-color:var(--accent); background:var(--surface); }
#send {
  border:none; background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff;
  width:42px; height:42px; border-radius:50%; font-size:17px; cursor:pointer; flex-shrink:0;
}
#send:disabled { opacity:.4; }
#send.stop { background:#e74c3c; }

/* ---------- 朗读 ---------- */
.speak-btn {
  border:none; background:none; color:var(--text-faint); font-size:14px;
  cursor:pointer; padding:4px 8px; align-self:flex-start; margin-top:2px;
  flex-shrink:0;
}
.speak-btn:active { color:var(--accent); }

/* ---------- 重试按钮 ---------- */
.retry-btn {
  border:1px solid var(--input-border); background:var(--input-bg); color:var(--text);
  font-size:12px; padding:5px 14px; border-radius:14px; cursor:pointer; margin-top:6px;
}
.retry-btn:active { background:var(--item-active,#eef4f8); }

/* ---------- 时间戳/用量 ---------- */
.msg .time {
  font-size:10px; color:var(--text-faint);
  align-self:flex-end; margin:0 2px 2px; white-space:nowrap;
}

/* ---------- 复制/快捷标签/导出 ---------- */
.copy-btn {
  border:none; background:none; color:var(--text-faint); font-size:13px;
  cursor:pointer; padding:4px 8px; align-self:flex-start; margin-top:2px; flex-shrink:0;
}
.copy-btn:active { color:var(--accent); }
#quickChips {
  display:flex; gap:6px; padding:0 4px 8px; overflow-x:auto; width:100%;
}
.chip {
  flex-shrink:0; border:1px solid var(--input-border); background:var(--input-bg);
  color:var(--text-dim); font-size:12px; padding:5px 12px; border-radius:14px; cursor:pointer;
}
.chip:active { background:var(--item-active, #eef4f8); color:var(--accent); }
#exportBtn {
  margin:0 12px 10px; padding:9px; border:1px solid var(--input-border); border-radius:8px;
  background:var(--surface); color:var(--text); font-size:13px; cursor:pointer;
}

/* ---------- 图片附件 ---------- */
#previews {
  display:none; gap:8px; padding:0 4px 8px; overflow-x:auto;
  width:100%;
}
.thumb { position:relative; flex-shrink:0; }
.thumb img {
  width:56px; height:56px; object-fit:cover; border-radius:8px;
  border:1px solid var(--border);
}
.thumb button {
  position:absolute; top:-6px; right:-6px; width:20px; height:20px;
  border:none; border-radius:50%; background:#e74c3c; color:#fff;
  font-size:11px; cursor:pointer; line-height:1;
}
#attachBtn { font-size:18px; }

/* ---------- 会话抽屉 ---------- */
#mask { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:98; display:none; }
#mask.show { display:block; }
#drawer {
  position:fixed; top:0; left:0; bottom:0; width:80%; max-width:300px;
  background:var(--surface); z-index:99; transform:translateX(-105%);
  transition:transform .25s ease; display:flex; flex-direction:column;
  box-shadow:2px 0 20px rgba(0,0,0,.2);
}
#drawer.open { transform:none; }
#drawer .head {
  padding:16px; background:linear-gradient(135deg,#0f2027,#2c5364);
  color:#fff; flex-shrink:0;
}
#drawer .head .t { font-size:16px; font-weight:bold; }
#drawer .head .s { font-size:11px; opacity:.7; margin-top:3px; }
#newSessionBtn {
  margin:10px 12px; padding:10px; border:none; border-radius:8px;
  background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff;
  font-size:14px; font-weight:bold; cursor:pointer; flex-shrink:0;
}
#sessionList { flex:1; overflow-y:auto; }
.session-item {
  padding:12px 10px 12px 14px; display:flex; align-items:center; gap:6px;
  border-bottom:1px solid var(--item-border); cursor:pointer;
}
.session-item.active { background:var(--item-active); border-left:3px solid var(--accent); padding-left:11px; }
.session-item .name {
  flex:1; font-size:14px; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.session-item .time { font-size:10px; color:var(--text-faint); }
.session-item .del {
  border:none; background:none; color:var(--text-faint); font-size:16px;
  padding:6px; cursor:pointer; flex-shrink:0;
}
.session-item .del:active { color:#e74c3c; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="iconbtn" id="menuBtn">☰</button>
    <h1 id="chatTitle">Pi 聊天</h1>
    <span id="modelBadge">加载中…</span>
    <button class="iconbtn" id="themeBtn" title="明亮/深色">🌙</button>
    <button class="iconbtn" id="newBtn" title="新对话">✚</button>
  </header>

  <div id="messages">
    <div id="empty">
      <div class="big">🤖</div>
      对话由本机 pi 驱动，无需任何 key<br>
      <span style="font-size:12px">点左上角 ☰ 管理多个对话</span>
    </div>
  </div>

  <div id="composer">
    <div id="quickChips">
      <button class="chip" data-text="帮我总结这次对话的要点">总结</button>
      <button class="chip" data-text="把下面的内容翻译成英文：">翻译</button>
      <button class="chip" data-text="帮我润色下面这段文字：">润色</button>
      <button class="chip" data-text="解释下面这段代码的作用：">解释代码</button>
    </div>
    <div id="previews"></div>
    <div style="display:flex;align-items:flex-end;gap:8px;width:100%">
      <button class="iconbtn" id="attachBtn" title="上传图片">📎</button>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
      <button id="send">➤</button>
    </div>
  </div>
</div>

<div id="mask"></div>
<div id="drawer">
  <div class="head">
    <div class="t">Pi 聊天</div>
    <div class="s" id="drawerInfo"></div>
  </div>
  <button id="newSessionBtn">✚ 新对话</button>
  <div style="padding:0 12px 4px;">
    <div style="font-size:12px;color:var(--text-dim);margin:6px 0 4px;">模型（切换后即时生效）</div>
    <select id="modelSel" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:13px;">
      <option>加载中…</option>
    </select>
  </div>
  <button id="exportBtn">📤 导出当前对话 (.md)</button>
  <div style="padding:0 12px 8px;flex-shrink:0">
    <input id="sessionSearch" type="text" placeholder="🔍 搜索会话…" autocomplete="off"
      style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:13px;outline:none">
  </div>
  <div id="sessionList"></div>
</div>

<script>
"use strict";
var $ = function(id){ return document.getElementById(id); };
var busy = false;
var aborting = false;
var currentId = localStorage.getItem("pi_active_session") || "";
var sessions = [];

/* ---------- 主题 ---------- */
var theme = localStorage.getItem("pi_theme") || "light";
function applyTheme(){
  document.body.classList.toggle("dark", theme === "dark");
  $("themeBtn").textContent = theme === "dark" ? "☀️" : "🌙";
}
applyTheme();
$("themeBtn").onclick = function(){
  theme = theme === "dark" ? "light" : "dark";
  localStorage.setItem("pi_theme", theme);
  applyTheme();
};

/* ---------- 启动 ---------- */
fetch("/info").then(r=>r.json()).then(function(info){
  $("modelBadge").textContent = info.model || "未知";
  $("drawerInfo").textContent = (info.model||"") + " · " + (info.sessions||0) + " 个会话";
}).catch(function(){
  $("modelBadge").textContent = "桥接离线";
});

function loadModels(){
  fetch("/models").then(r=>r.json()).then(function(d){
    var sel = $("modelSel");
    sel.innerHTML = "";
    var curKey = (d.current.provider||"") + "|" + (d.current.model||"");
    (d.list||[]).forEach(function(m){
      var key = m.provider + "|" + m.model;
      var o = document.createElement("option");
      o.value = key; o.textContent = m.name;
      if (key === curKey) o.selected = true;
      sel.appendChild(o);
    });
    if (!sel.options.length) sel.innerHTML = '<option>无可用模型</option>';
  }).catch(function(){});
}
$("modelSel").onchange = function(){
  var parts = this.value.split("|");
  if (parts.length < 2) return;
  fetch("/model", { method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({ provider: parts[0], model: parts[1], id: currentId }) })
  .then(r=>r.json()).then(function(d){
    $("modelBadge").textContent = parts[1];
    $("drawerInfo").textContent = parts[1] + " · " + sessions.length + " 个会话";
    if (!d.live) { addMsg("err", "ℹ 当前供应商不支持对话中途切换，已自动新建对话使用新模型"); createSession(); }
  }).catch(function(){ alert("切换失败"); });
};

initSessions();
function initSessions(){
  fetch("/sessions").then(r=>r.json()).then(function(list){
    sessions = list || [];
    var found = sessions.find(function(s){ return s.id === currentId; });
    if (!found) currentId = sessions.length ? sessions[0].id : "";
    if (currentId) {
      openSession(currentId, true);
    } else {
      createSession();
    }
  }).catch(function(){
    $("modelBadge").textContent = "桥接离线";
  });
}

/* ---------- 输入草稿（按会话各自保存/恢复） ---------- */
var DRAFT_KEY = "pi_drafts";
function loadDrafts(){
  try { return JSON.parse(localStorage.getItem(DRAFT_KEY)) || {}; } catch(e){ return {}; }
}
function saveDraft(id, text){
  if (!id) return;
  var d = loadDrafts();
  if (text) d[id] = text; else delete d[id];
  var keys = Object.keys(d);
  if (keys.length > 30) delete d[keys[0]];
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch(e){}
}
function restoreDraft(id){
  input.value = loadDrafts()[id] || "";
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
}

/* ---------- 会话管理 ---------- */
function renderSessions(){
  var html = "";
  var kw = (($("sessionSearch") && $("sessionSearch").value) || "").trim().toLowerCase();
  var list = kw ? sessions.filter(function(s){ return (s.name||"").toLowerCase().indexOf(kw) >= 0; }) : sessions;
  for (var i=0;i<list.length;i++){
    var s = list[i];
    var d = new Date(s.updatedAt);
    var t = (d.getMonth()+1) + "/" + d.getDate() + " " +
            ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
    html += '<div class="session-item' + (s.id===currentId?" active":"") + '" data-id="' + s.id + '">' +
      '<div style="flex:1;min-width:0" data-open="' + s.id + '">' +
        '<div class="name">' + esc(s.name) + '</div>' +
        '<div class="time">' + t + '</div>' +
      '</div>' +
      '<button class="del" data-del="' + s.id + '">✕</button>' +
    '</div>';
  }
  $("sessionList").innerHTML = html || '<div style="padding:30px;text-align:center;color:#bbb;font-size:13px">' + (kw ? "无匹配会话" : "暂无会话") + '</div>';
}
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function refreshSessions(){
  return fetch("/sessions").then(r=>r.json()).then(function(list){
    sessions = list || [];
    renderSessions();
    $("drawerInfo").textContent = $("modelBadge").textContent + " · " + sessions.length + " 个会话";
  });
}

function openSession(id, silent){
  saveDraft(currentId, input.value);
  currentId = id;
  localStorage.setItem("pi_active_session", id);
  var s = sessions.find(function(x){ return x.id === id; });
  $("chatTitle").textContent = s ? s.name : "Pi 聊天";
  renderSessions();
  closeDrawer();
  restoreDraft(id);
  fetch("/history?id=" + encodeURIComponent(id))
    .then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(function(msgs){
      $("messages").innerHTML = "";
      if (!msgs || !msgs.length){
        $("messages").innerHTML = '<div id="empty"><div class="big">🤖</div>新对话已开始</div>';
        return;
      }
      for (var i=0;i<msgs.length;i++){
        var d = addMsg(msgs[i].role === "user" ? "user" : "bot", mdRender(msgs[i].content));
        if (msgs[i].role !== "user") { addSpeakBtn(d); addCopyBtn(d); }
      }
      scrollBottom();
    })
    .catch(function(){
      if (!silent){
        addMsg("err", "⚠ 会话不存在（桥接可能重启过），请新建对话");
      } else {
        createSession();
      }
    });
}

var creatingSession = false, deletingSession = false;
function createSession(){
  if (creatingSession) return;
  creatingSession = true;
  var btn = $("newSessionBtn");
  var old = btn.textContent;
  btn.textContent = "创建中…"; btn.disabled = true;
  $("chatTitle").textContent = "创建中…";
  fetch("/sessions", { method:"POST" }).then(r=>r.json()).then(function(r){
    return refreshSessions().then(function(){ openSession(r.id); });
  }).catch(function(e){
    $("chatTitle").textContent = "Pi 聊天";
  }).finally(function(){
    creatingSession = false;
    btn.textContent = old; btn.disabled = false;
  });
}

function deleteSession(id){
  if (deletingSession) return;
  if (!confirm("删除这个对话？")) return;
  deletingSession = true;
  fetch("/sessions?id=" + encodeURIComponent(id), { method:"DELETE" }).then(function(){
    return refreshSessions();
  }).then(function(){
    saveDraft(id, "");
    if (id === currentId){
      if (sessions.length) openSession(sessions[0].id);
      else createSession();
    }
  }).finally(function(){ deletingSession = false; });
}

$("sessionSearch").addEventListener("input", renderSessions);
$("menuBtn").onclick = function(){ $("drawer").classList.add("open"); $("mask").classList.add("show"); refreshSessions(); loadModels(); };
$("mask").onclick = closeDrawer;
function closeDrawer(){ $("drawer").classList.remove("open"); $("mask").classList.remove("show"); }
$("newSessionBtn").onclick = function(){ closeDrawer(); if (!busy) createSession(); };
$("newBtn").onclick = function(){ if (!busy) createSession(); };
$("sessionList").addEventListener("click", function(e){
  var del = e.target.getAttribute("data-del");
  if (del) { deleteSession(del); return; }
  var open = e.target.getAttribute("data-open") || (e.target.closest && e.target.closest("[data-open]")?.getAttribute("data-open"));
  if (open && !busy) openSession(open);
});

/* ---------- 朗读（系统TTS） ---------- */
function addSpeakBtn(msgDiv){
  if (!msgDiv || msgDiv.querySelector(".speak-btn")) return;
  var sb = document.createElement("button");
  sb.className = "speak-btn"; sb.textContent = "🔊"; sb.title = "朗读";
  msgDiv.appendChild(sb);
}
function addCopyBtn(msgDiv){
  if (!msgDiv || msgDiv.querySelector(".copy-btn")) return;
  var cb = document.createElement("button");
  cb.className = "copy-btn"; cb.textContent = "📋"; cb.title = "复制";
  msgDiv.appendChild(cb);
}
try { speechSynthesis.getVoices(); } catch(e){}
var speakState = { btn: null };
function setSpeakIcons(t){
  Array.prototype.forEach.call(document.querySelectorAll(".speak-btn"), function(x){ x.textContent = t; });
}
function cleanSpeakText(clone){
  Array.prototype.forEach.call(clone.querySelectorAll("pre"), function(x){ x.remove(); });
  var t = clone.textContent || "";
  t = t.replace(/https?:\/\/\S+/g, "，这里有个链接，略。")
       .replace(/`([^`]*)`/g, "$1")
       .replace(/[*#>|_]+/g, " ")
       .replace(/\s+/g, " ").trim();
  return t.slice(0, 3000);
}
function chunkSpeak(t){
  var out = [], cur = "";
  var segs = t.split(/(。|！|!|？|\?|；|;|\n)/);
  for (var i = 0; i < segs.length; i++){
    cur += segs[i];
    if (cur.length >= 120 && /[。！！？?；;\n]$/.test(cur)) { out.push(cur); cur = ""; }
    else if (cur.length >= 200) { out.push(cur); cur = ""; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(function(s){ return s.trim(); });
}
$("messages").addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest(".speak-btn") : null;
  if (!b || !window.speechSynthesis) return;
  function setAll(t){ setSpeakIcons(t); }
  // 暂停中 → 续播
  if (speechSynthesis.paused) { speechSynthesis.resume(); setAll("🔊"); b.textContent = "⏸"; return; }
  // 播放中 → 点同一个按钮暂停，点别的按钮切换
  if (speechSynthesis.speaking) {
    if (b === speakState.btn) { speechSynthesis.pause(); b.textContent = "▶️"; return; }
    speechSynthesis.cancel();
  }
  var bubble = b.closest(".msg").querySelector(".bubble");
  var clone = bubble.cloneNode(true);
  var tk = clone.querySelector(".think"); if (tk) tk.remove();
  var txt = cleanSpeakText(clone);
  if (!txt) return;
  var parts = chunkSpeak(txt);
  if (!parts.length) return;
  var voice = null;
  var vs = speechSynthesis.getVoices();
  for (var i = 0; i < vs.length; i++) if (/^zh|cmn|Chinese/i.test(vs[i].lang)) { voice = vs[i]; break; }
  speakState.btn = b;
  setAll("🔊"); b.textContent = "⏸";
  var idx = 0;
  function speakNext(){
    if (idx >= parts.length) { setAll("🔊"); speakState.btn = null; return; }
    var u = new SpeechSynthesisUtterance(parts[idx++]);
    u.lang = "zh-CN"; if (voice) u.voice = voice; u.rate = 1;
    u.onend = speakNext;
    u.onerror = function(){ setAll("🔊"); speakState.btn = null; };
    speechSynthesis.speak(u);
  }
  speakNext();
});


/* ---------- 图片附件 ---------- */
var pendingImages = [], askImages = [], lastUsage = null;
$("attachBtn").onclick = function(){ $("fileInput").click(); };
function addImageFiles(files){
  Array.prototype.forEach.call(files || [], function(f){
    if (!f || !/^image\//.test(f.type)) return;
    if (f.size > 20 * 1024 * 1024) { alert("图片不能超过 20MB：" + f.name); return; }
    if (pendingImages.length >= 3) { alert("最多同时附 3 张图片"); return; }
    compressImage(f, function(mediaType, b64){
      pendingImages.push({ mediaType: mediaType, data: b64 });
      renderPreviews();
    });
  });
}
$("fileInput").addEventListener("change", function(){
  addImageFiles(this.files);
  this.value = "";
});
/* 粘贴剪贴板图片自动作为附件 */
$("input").addEventListener("paste", function(e){
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  var files = [];
  for (var i = 0; i < items.length; i++){
    if (/^image\//.test(items[i].type)) {
      var f = items[i].getAsFile();
      if (f) files.push(f);
    }
  }
  if (files.length) { e.preventDefault(); addImageFiles(files); }
});

/* ---------- 复制按钮 ---------- */
$("messages").addEventListener("click", function(e){
  var cb = e.target.closest ? e.target.closest(".copy-btn") : null;
  if (!cb) return;
  var bubble = cb.closest(".msg").querySelector(".bubble");
  var clone = bubble.cloneNode(true);
  Array.prototype.forEach.call(clone.querySelectorAll(".speak-btn,.copy-btn,.think"), function(x){ x.remove(); });
  var txt = clone.textContent || "";
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){
      cb.textContent = "✅"; setTimeout(function(){ cb.textContent = "📋"; }, 1200);
    }).catch(function(){ cb.textContent = "❌"; setTimeout(function(){ cb.textContent = "📋"; }, 1200); });
  } else {
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); cb.textContent = "✅"; } catch { cb.textContent = "❌"; }
    setTimeout(function(){ cb.textContent = "📋"; document.body.removeChild(ta); }, 1200);
  }
});

/* ---------- 导出对话 ---------- */
if ($("exportBtn")) $("exportBtn").onclick = function(){
  if (!currentId) return;
  fetch("/history?id=" + encodeURIComponent(currentId))
    .then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(function(msgs){
      if (!msgs || !msgs.length) { alert("当前对话为空"); return; }
      var s = sessions.find(function(x){ return x.id === currentId; });
      var title = s ? s.name : "对话";
      var md = "# " + title + "\n\n";
      for (var i=0;i<msgs.length;i++){
        md += "**" + (msgs[i].role === "user" ? "User" : "Assistant") + ":**\n\n" + msgs[i].content + "\n\n---\n\n";
      }
      var blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = title.replace(/[^\w\u4e00-\u9fa5]+/g, "_") + ".md";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
    })
    .catch(function(){ alert("导出失败"); });
};
function compressImage(file, done){
  var r = new FileReader();
  r.onload = function(){
    var img = new Image();
    img.onload = function(){
      var MAX = 1600, w = img.width, h = img.height;
      if (w <= MAX && h <= MAX && file.size <= 1024*1024) {
        done(file.type || "image/png", String(r.result).split(",")[1] || ""); return;
      }
      var scale = Math.min(1, MAX / Math.max(w, h));
      var cv = document.createElement("canvas");
      cv.width = Math.round(w*scale); cv.height = Math.round(h*scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      var out = cv.toDataURL("image/jpeg", 0.8);
      done("image/jpeg", out.split(",")[1] || "");
    };
    img.onerror = function(){ done(file.type || "image/png", String(r.result).split(",")[1] || ""); };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
function renderPreviews(){
  var h = "";
  for (var i = 0; i < pendingImages.length; i++){
    h += '<span class="thumb"><img src="data:' + pendingImages[i].mediaType + ';base64,' + pendingImages[i].data + '" alt="图"><button data-rm="' + i + '">✕</button></span>';
  }
  var pv = $("previews");
  pv.innerHTML = h;
  pv.style.display = pendingImages.length ? "flex" : "none";
}
$("previews").addEventListener("click", function(e){
  var rm = e.target.getAttribute ? e.target.getAttribute("data-rm") : null;
  if (rm !== null && rm !== undefined) { pendingImages.splice(Number(rm), 1); renderPreviews(); }
});

/* ---------- 输入 & 发送 ---------- */
var input = $("input");
input.addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
  saveDraft(currentId, this.value);
});
$("send").onclick = function(){ busy ? stopGen() : send(); };

function mdRender(t){
  var esc = t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  var blocks = [];
  // 先摘出代码块，避免内部内容被行内规则误伤
  var out = esc.replace(/```(\w*)\n?([\s\S]*?)```/g, function(mm,l,c){
    blocks.push('<pre><code>'+c.replace(/\n$/,"")+'</code></pre>');
    return "\u0000B" + (blocks.length-1) + "\u0000";
  });
  var openFence = out.split("```").length - 1;
  if (openFence % 2 === 1) {
    var idx = out.lastIndexOf("```");
    var lang = out.slice(idx+3).match(/^\w*\n?/)[0];
    blocks.push('<pre><code>' + out.slice(idx+3+lang.length).replace(/\n$/,"") + '</code></pre>');
    out = out.slice(0, idx) + "\u0000B" + (blocks.length-1) + "\u0000";
  }
  out = out
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  out = out.replace(/(https?:\/\/[^\s<>"']+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/\u0000B(\d+)\u0000/g, function(mm,i){ return blocks[Number(i)]; });
  return out;
}
function addMsg(role, html){
  var e = $("empty"); if (e) e.remove();
  var d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = '<div class="bubble">' + html + "</div>";
  $("messages").appendChild(d);
  $("messages").scrollTop = $("messages").scrollHeight;
  var ts = document.createElement("span");
  ts.className = "time";
  ts.textContent = new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  d.appendChild(ts);
  return d.querySelector(".bubble");
}
function scrollBottom(){ $("messages").scrollTop = $("messages").scrollHeight; }

function send(){
  var text = input.value.trim();
  var hasImgs = pendingImages.length > 0;
  if ((!text && !hasImgs) || busy) return;
  if (creatingSession) { addMsg("err", "⏳ 新会话创建中，请稍候 1~2 秒再发"); return; }
  if (!currentId) { createSession(); return; }
  var imgs = pendingImages.slice();
  pendingImages = []; renderPreviews();
  input.value = ""; input.style.height = "auto";
  saveDraft(currentId, "");
  addMsg("user", mdRender(text) + (imgs.length ? " 📎×" + imgs.length : ""));
  askImages = imgs;
  ask(text);
}

function ask(text, isRetry){
  busy = true; aborting = false;
  var btn = $("send");
  btn.textContent = "■"; btn.classList.add("stop");
  var bubble = addMsg("bot", '<span class="cursor"></span>');
  var acc = "", think = "", buf = "";

  function render(){
    var html = "";
    if (think) {
      html += acc
        ? '<div class="think">💭 已深度思考 ' + think.length + ' 字</div>'
        : '<div class="think live">💭 ' + esc(think.slice(-160)) + '</div>';
    }
    if (acc || !think) html += mdRender(acc);
    bubble.innerHTML = html + '<span class="cursor"></span>';
    scrollBottom();
  }

  function attempt(){
    return fetch("/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ message: text, id: currentId, images: askImages })
    }).then(function(res){
      if (!res.ok) return res.text().then(function(t){
        var err = new Error(t || ("HTTP " + res.status));
        err.status = res.status;
        throw err;
      });
      var reader = res.body.getReader();
      var dec = new TextDecoder();
      function pump(){
        return reader.read().then(function(r){
          if (r.done) return finish();
          buf += dec.decode(r.value, { stream:true });
          var lines = buf.split("\n");
          buf = lines.pop();
          for (var i=0;i<lines.length;i++){
            var line = lines[i].trim();
            if (!line) continue;
            try {
              var ev = JSON.parse(line);
              if (ev.t === "text")  { acc  += ev.d; render(); }
              if (ev.t === "think") { think += ev.d; render(); }
              if (ev.t === "usage") { lastUsage = { input: ev.input || 0, output: ev.output || 0 }; }
              if (ev.t === "error") { throw new Error(ev.d); }
            } catch(e){ if (e instanceof SyntaxError) continue; throw e; }
          }
          return pump();
        });
      }
      return pump();
    });
  }

  attempt().catch(function(e){
    // 会话随桥接重启消失 → 自动新建并重发同一条消息（仅一次）
    if (e.status === 404 && !isRetry){
      bubble.innerHTML = '<div class="think">♻ 检测到服务已重启，正在新会话中重发…</div><span class="cursor"></span>';
      acc = ""; think = ""; buf = "";
      return fetch("/sessions", { method:"POST" }).then(r=>r.json()).then(function(nr){
        currentId = nr.id;
        localStorage.setItem("pi_active_session", nr.id);
        return refreshSessions().then(function(){
          var s = sessions.find(function(x){ return x.id === nr.id; });
          $("chatTitle").textContent = s ? s.name : "Pi 聊天";
          return attempt();
        });
      }).catch(function(e2){
        resetBusy();
        bubble.innerHTML = "⚠ " + esc(e2.message || "自动恢复失败") +
          '<br><span style="font-size:11px;color:#999">桥接可能未运行：Termux 项目目录里执行 sh serve.sh</span>';
        var msgDiv = bubble.parentElement;
        if (msgDiv && !msgDiv.querySelector(".retry-btn")) {
          var rb = document.createElement("button");
          rb.className = "retry-btn"; rb.textContent = "🔄 重试";
          rb.setAttribute("data-retry", text);
          msgDiv.appendChild(rb);
        }
      });
      return;
    }
    resetBusy();
    var emsg = e.message || "";
    var hint = (e.status === 413) ? "请求体积超限，请减少图片张数" :
               (e.status === 429) ? "上一条还在生成中" :
               (/insufficient_user_quota|预扣费/.test(emsg)) ? "该模型供应商余额不足，请点 ☰ 抽屉换一个模型" :
               (e.status === 404 && !isRetry) ? "" :
               "桥接可能未运行：Termux 项目目录里执行 sh serve.sh";
    bubble.innerHTML = "⚠ " + esc(e.message || "请求失败") +
      '<br><span style="font-size:11px;color:#999">' + hint + '</span>';
    var msgDiv = bubble.parentElement;
    if (msgDiv && !msgDiv.querySelector(".retry-btn")) {
      var rb = document.createElement("button");
      rb.className = "retry-btn"; rb.textContent = "🔄 重试";
      rb.setAttribute("data-retry", text);
      msgDiv.appendChild(rb);
    }
  });
  function resetBusy(){
    busy = false;
    btn.textContent = "➤"; btn.classList.remove("stop");
  }
  function finish(){
    if (acc) {
      bubble.innerHTML = (think ? '<div class="think">💭 已深度思考</div>' : "") + mdRender(acc);
    } else if (!aborting) {
      bubble.innerHTML = "（空回复：疑似该模型余额不足，点 ☰ 抽屉切换模型）";
    }
    busy = false;
    btn.textContent = "➤"; btn.classList.remove("stop");
    if (lastUsage && (lastUsage.input || lastUsage.output)) {
      var usp = document.createElement("span");
      usp.className = "time";
      usp.textContent = "(" + lastUsage.input + "+" + lastUsage.output + " tok)";
      bubble.parentElement.appendChild(usp);
    }
    lastUsage = null;
    addSpeakBtn(bubble.parentElement);
    addCopyBtn(bubble.parentElement);
    scrollBottom();
    refreshSessions();
  }
}

function stopGen(){
  aborting = true;
  fetch("/abort", { method:"POST" });
}

/* ---------- 重试按钮 ---------- */
$("messages").addEventListener("click", function(e){
  var rb = e.target.closest ? e.target.closest(".retry-btn") : null;
  if (!rb || busy) return;
  var text = rb.getAttribute("data-retry");
  if (!text) return;
  var errMsg = rb.closest(".msg");
  if (errMsg) errMsg.remove();
  ask(text, true);
});

input.addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey && matchMedia("(hover:hover)").matches) {
    e.preventDefault(); send();
  }
});
</script>
